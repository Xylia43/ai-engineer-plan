                lesson: `<h3>一、为什么要讲工程化？</h3><p>AI应用工程师不是算法研究员，核心是产出<strong>可维护、可复用、稳定运行</strong>的工具和系统。代码写得短不算本事，别人能看懂、出问题能排查、半年后自己还能看懂，才是工程能力。</p><h3>二、PEP8 编码核心规范（必须遵守）</h3><ul><li><strong>命名规范：</strong>函数、变量用<span class="code-inline">蛇形命名法</span>（小写+下划线，如 get_user_info）；类名用大驼峰；常量全大写。</li><li><strong>缩进：</strong>统一4个空格，禁止Tab和空格混用。</li><li><strong>行长度：</strong>单行不超过79字符，过长就换行拆分。</li><li><strong>空行：</strong>函数之间空2行；函数内逻辑块之间空1行，提升可读性。</li><li><strong>导入顺序：</strong>标准库 → 第三方库 → 本地模块，分组空行隔开。</li></ul><h3>三、模块化编程：把大功能拆成小函数</h3><p>核心原则：<strong>一个函数只做一件事</strong>。</p><ul><li>好处：易测试、易复用、出问题好定位、多人协作不冲突。</li><li>判断标准：如果你描述一个函数需要用「和」「然后」，就该拆了。</li><li>每个函数必须加<strong>文档字符串（docstring）</strong>：说明功能、参数、返回值。</li></ul><h3>四、异常处理：让程序崩得优雅</h3><p>工程化代码绝对不能一报错就直接崩溃。</p><ul><li>基础结构：try → except → finally</li><li>不要写空的 except，要捕获具体异常类型。</li><li>捕获异常后要<strong>记录日志/打印错误信息</strong>，不能悄无声息地吞掉错误。</li><li>AI调用场景，必须处理：网络错误、限流、密钥错误、参数错误四类异常。</li></ul><h3>五、代码示例</h3><p>❌ 反面示例（不规范、一坨到底）：</p><div class="code-block">import requests,json
k='sk-xxx'
def f(t):
    r=requests.post('https://api.example.com/v1/chat/completions',headers={'Authorization':'Bearer '+k},json={'model':'gpt-4o-mini','messages':[{'role':'user','content':t}]})
    return r.json()['choices'][0]['message']['content']</div><p>✅ 正面示例（工程化规范）：</p><div class="code-block">import requests
from typing import Optional

# 配置常量
API_KEY = "your_api_key"
BASE_URL = "https://api.example.com/v1/chat/completions"
MODEL_NAME = "gpt-4o-mini"


def call_llm(prompt):
    """调用大模型生成回答

    Args:
        prompt: 用户输入的提示词

    Returns:
        模型生成的文本内容，调用失败返回None
    """
    headers = {"Authorization": "Bearer " + API_KEY}
    payload = {
        "model": MODEL_NAME,
        "messages": [{"role": "user", "content": prompt}],
        "temperature": 0.7
    }

    try:
        response = requests.post(BASE_URL, headers=headers, json=payload)
        response.raise_for_status()
        result = response.json()
        return result["choices"][0]["message"]["content"]
    except requests.exceptions.RequestException as e:
        print("调用大模型失败: " + str(e))
        return None</div><h3>六、动手练习</h3><div class="practice-box"><strong>练习目标：</strong>把上面的反面示例，改写成符合工程化规范的代码。<br><br><strong>要求：</strong><ol><li>统一命名规范，变量和函数用蛇形命名</li><li>拆分成至少2个函数：一个构造请求参数，一个发起调用</li><li>每个函数加上文档字符串</li><li>添加异常处理，捕获网络请求错误</li><li>常量提取到顶部，不硬编码在函数里</li></ol><strong>验收标准：</strong>代码能正常运行；格式清晰、易读；出错时不会直接崩溃，会打印错误信息。</div><div class="highlight-box">今日核心心法：代码首先是写给人看的，顺便能在机器上运行。</div>`,

            // 第1周周二
            {
                title: "第1周周二：Git版本控制核心操作",
                lesson: `<h3>一、Git 是什么？为什么必须会？</h3><p>Git是分布式版本控制系统，是所有程序员的标配工具。它帮你记录代码每一次修改、随时回退、多人协作不打架，也是你作品集的载体。</p><h3>二、核心概念：工作区 → 暂存区 → 本地仓库</h3><ul><li><strong>工作区：</strong>你电脑上看得见的文件，改代码就是在改工作区。</li><li><strong>暂存区：</strong>临时存放你准备提交的修改，用 git add 放进来。</li><li><strong>本地仓库：</strong>正式保存的历史版本，用 git commit 提交。</li><li><strong>远程仓库：</strong>GitHub/Gitee等服务器上的仓库，用 git push 上传。</li></ul><h3>三、必须背下来的核心命令</h3><ul><li><span class="code-inline">git init</span>：在当前文件夹初始化Git仓库</li><li><span class="code-inline">git status</span>：查看当前文件状态（哪些改了、哪些暂存了）</li><li><span class="code-inline">git add 文件名</span>：把文件加入暂存区；git add . 全部加入</li><li><span class="code-inline">git commit -m "提交说明"</span>：提交到本地仓库，说明要写清楚做了什么</li><li><span class="code-inline">git log</span>：查看提交历史记录</li><li><span class="code-inline">git diff</span>：查看具体修改了哪些内容</li></ul><h3>四、分支基础操作</h3><ul><li>分支的意义：并行开发，新功能开新分支，不影响主分支稳定代码。</li><li><span class="code-inline">git branch 分支名</span>：创建分支</li><li><span class="code-inline">git checkout 分支名</span>：切换分支</li><li><span class="code-inline">git merge 分支名</span>：把指定分支合并到当前分支</li></ul><h3>五、代码示例：完整提交流程</h3><div class="code-block"># 1. 进入项目文件夹，初始化仓库
cd my-project
git init

# 2. 查看状态（红色是工作区修改，未暂存）
git status

# 3. 把所有修改加入暂存区
git add .

# 4. 再次查看状态（绿色是已暂存，待提交）
git status

# 5. 提交到本地仓库，写规范的提交信息
git commit -m "feat: 新增大模型调用函数，添加异常处理"

# 6. 查看提交历史
git log --oneline

# 7. 关联远程仓库并推送（第一次需要）
git remote add origin https://github.com/你的用户名/仓库名.git
git push -u origin main</div><h3>六、Commit 信息规范</h3><ul><li><span class="code-inline">feat:</span> 新增功能</li><li><span class="code-inline">fix:</span> 修复bug</li><li><span class="code-inline">docs:</span> 文档修改</li><li><span class="code-inline">refactor:</span> 代码重构，不改变功能</li><li><span class="code-inline">style:</span> 格式调整，不影响代码逻辑</li></ul><h3>七、动手练习</h3><div class="practice-box"><strong>练习目标：</strong>完整走一遍「创建项目→写代码→提交→推送到GitHub」流程。<br><br><strong>步骤：</strong><ol><li>新建一个文件夹，用git init初始化仓库</li><li>创建一个Python文件，写一个简单函数</li><li>git add 暂存，git commit提交，写规范的commit信息</li><li>修改函数，增加一个参数，再次add+commit</li><li>用git log查看两次提交记录</li><li>（可选）新建feature分支，修改后合并回主分支</li></ol><strong>验收标准：</strong>git log能看到至少2次提交记录；commit信息清晰规范。</div><div class="highlight-box">Commit 信息写清楚：「做了什么+为什么」，半年后你会感谢现在的自己。</div>`,
                todos: [

                        options: ["commit → add", "add → commit", "init → commit"],
                        answer: 1,

            // 第1周周三
            {
                title: "第1周周三：大模型全局认知与能力边界",
                lesson: `<h3>一、大模型不是「超级大脑」，是「文本预测机」</h3><p>核心原理：根据上文，概率性地预测下一个字。它不懂「真相」，只懂「语言规律」。这决定了它擅长生成、总结、翻译，不擅长精确计算、事实核查、实时信息。</p><h3>二、必须懂的核心概念</h3><ul><li><strong>Token：</strong>模型处理文本的基本单位。汉字约1字=1-2个token；输入+输出总token不能超过上下文窗口。</li><li><strong>上下文窗口：</strong>模型一次性能记住的总文本长度。窗口越大，能处理的文档越长，但成本越高。</li><li><strong>温度参数（Temperature）：</strong>0~2之间。越低越确定、越保守；越高越随机、越有创意。<ul><li>事实类、数据类任务：0.1~0.3</li><li>通用场景：0.6~0.7</li><li>创意写作：0.9~1.2</li></ul></li><li><strong>Top P：</strong>另一种随机性控制，和温度调一个就行，不用两个都改。</li></ul><h3>三、主流模型选型指南</h3><ul><li><strong>GPT-4o / Claude 3.5 Opus：</strong>综合能力最强，复杂推理、长文档处理首选，成本高。</li><li><strong>GPT-4o mini / Claude 3.5 Haiku：</strong>性价比之王，日常任务、批量处理首选，成本极低。</li><li><strong>开源模型（Llama、Qwen等）：</strong>可本地部署、数据不对外，适合隐私敏感场景，需要自己运维。</li></ul><h3>四、大模型的能力边界（非常重要）</h3><p><strong>擅长：</strong>文本生成、总结摘要、翻译、改写、代码辅助、思路启发、信息整理、常规问答。</p><p><strong>不擅长/不可信：</strong>精确数学计算、实时信息、事实核查、医疗/法律专业建议、私密数据处理。</p><p><strong>天生缺陷：幻觉（Hallucination）</strong>——会一本正经地编造不存在的事实和数据。解决方法：RAG检索增强、引用来源、人工校验。</p><h3>五、代码示例：不同温度参数对比</h3><div class="code-block">from openai import OpenAI

client = OpenAI(api_key="your_key")

def generate_with_temp(prompt, temp):

        temperature=temp
    )
    return resp.choices[0].message.content

import os
from typing import Optional

# 从环境变量读取密钥，不要硬编码
API_KEY = os.getenv("OPENAI_API_KEY")
BASE_URL = "https://api.openai.com/v1/chat/completions"


def call_chat_model(prompt, temperature=0.7):
    """调用聊天大模型

    Args:
        prompt: 用户提示词
        temperature: 温度参数，0-2之间

    Returns:
        生成的文本，失败返回None
    """
    if not API_KEY:
        print("错误：未配置API_KEY")
        return None

    headers = {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
    }

    payload = {
        "model": "gpt-4o-mini",
        "temperature": temperature,
        "messages": [
            {"role": "user", "content": prompt}
        ]
    }

    try:
        resp = requests.post(BASE_URL, headers=headers, json=payload, timeout=30)
        resp.raise_for_status()  # 状态码非200时抛出异常
        data = resp.json()
        return data["choices"][0]["message"]["content"]
    
    except requests.exceptions.Timeout:
        print("请求超时，请稍后重试")
        return None
    except requests.exceptions.HTTPError as e:
        print("HTTP错误: " + str(e.response.status_code) + " - " + e.response.text)
        return None
    except requests.exceptions.RequestException as e:
        print("请求失败: " + str(e))
        return None

        // 初始化
        function init() {
            // 绑定标签点击事件
            var tabs = document.querySelectorAll('.tab');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].addEventListener('click', function(e) {
                    var tabName = this.getAttribute('data-tab');
                    switchTab(tabName);
                });
            }
            
            updateDayInfo();
            renderLesson();
            renderTodo();
            renderQuiz();
            renderWeeklyQuiz();
            loadProgress();
        }

        // 计算当前学习日
        function getCurrentDayIndex() {
            var today = new Date();
            today.setHours(0,0,0,0);
            var start = new Date(START_DATE);
            start.setHours(0,0,0,0);
            var diff = Math.floor((today - start) / (1000*60*60*24));
            return Math.max(0, diff) + currentDayOffset;
        }

        // 更新日期信息
        function updateDayInfo() {
            var dayIndex = getCurrentDayIndex();
            var dayData = planData[dayIndex % planData.length];
            var date = new Date(START_DATE);
            date.setDate(date.getDate() + dayIndex);
            
            document.getElementById('dateInfo').innerHTML = 
                date.toLocaleDateString('zh-CN') + ' · ' + dayData.title;
            document.getElementById('dayLabel').textContent = '第 ' + (dayIndex + 1) + ' 天';
        }

        // 切换上一天/下一天
        function prevDay() {
            currentDayOffset--;
            if (getCurrentDayIndex() < 0) currentDayOffset++;
            updateDayInfo();
            renderLesson();
            renderTodo();
            renderQuiz();
            renderWeeklyQuiz();
            loadProgress();
        }

        function nextDay() {
            currentDayOffset++;
            updateDayInfo();
            renderLesson();
            renderTodo();
            renderQuiz();
            renderWeeklyQuiz();
            loadProgress();
        }

        // 切换标签页
        function switchTab(tabName) {
            var tabs = document.querySelectorAll('.tab');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
                if (tabs[i].getAttribute('data-tab') === tabName) {
                    tabs[i].classList.add('active');
                }
            }
            
            var panels = document.querySelectorAll('.panel');
            for (var j = 0; j < panels.length; j++) {
                panels[j].classList.remove('active');
            }
            document.getElementById(tabName + 'Panel').classList.add('active');
        }

        // 渲染学习内容
        function renderLesson() {
            var dayIndex = getCurrentDayIndex();
            var dayData = planData[dayIndex % planData.length];
            var content = document.getElementById('lessonContent');
            document.getElementById('lessonTitle').textContent = dayData.title;

            if (dayData.isRest) {
                content.innerHTML = '<div class="rest-tip">今日是休息日，好好休息复盘 💪</div>';
                return;
            }

            content.innerHTML = dayData.lesson;
        }

        // 渲染待办
        function renderTodo() {
            var dayIndex = getCurrentDayIndex();
            var dayData = planData[dayIndex % planData.length];
            var list = document.getElementById('todoList');

            if (dayData.isRest) {
                list.innerHTML = '<div class="rest-tip">今日是休息日，好好休息复盘即可 💪</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < dayData.todos.length; i++) {
                var id = 'todo_' + dayIndex + '_' + i;
                html += '<div class="todo-item" id="' + id + '_item">' +
                    '<input type="checkbox" id="' + id + '" onchange="saveTodo(' + dayIndex + ',' + i + ')">' +
                    '<label for="' + id + '">' + dayData.todos[i] + '</label>' +
                    '</div>';
            }
            list.innerHTML = html;
        }

        // 渲染每日小测
        function renderQuiz() {
            var dayIndex = getCurrentDayIndex();
            var dayData = planData[dayIndex % planData.length];
            var list = document.getElementById('quizList');

            if (dayData.isRest || !dayData.quiz || dayData.quiz.length === 0) {
                list.innerHTML = '<div class="rest-tip">今日无每日小测，可前往「每周大测」做周测</div>';
                document.querySelector('#quizPanel .submit-btn').style.display = 'none';
                return;
            }
            document.querySelector('#quizPanel .submit-btn').style.display = 'inline-block';

            var html = '';
            for (var i = 0; i < dayData.quiz.length; i++) {
                var q = dayData.quiz[i];
                var optionsHtml = '';
                for (var j = 0; j < q.options.length; j++) {
                    optionsHtml += '<label><input type="radio" name="daily_' + dayIndex + '_' + i + '" value="' + j + '"> ' + q.options[j] + '</label>';
                }
                html += '<div class="quiz-item">' +
                    '<div class="quiz-question">' + (i+1) + '. ' + q.q + '</div>' +
                    '<div class="quiz-options">' + optionsHtml + '</div>' +
                    '<div class="quiz-result" id="daily_result_' + dayIndex + '_' + i + '"></div>' +
                    '</div>';
            }
            list.innerHTML = html;
            document.getElementById('dailyScore').style.display = 'none';
        }

        // 渲染每周大测
        function renderWeeklyQuiz() {
            var dayIndex = getCurrentDayIndex();
            var weekIndex = Math.floor(dayIndex / 7);
            var weeklyIndex = weekIndex * 7 + 5;
            var weeklyData = planData[weeklyIndex];
            var list = document.getElementById('weeklyQuizList');

            if (!weeklyData || !weeklyData.isWeekly) {
                list.innerHTML = '<div class="rest-tip">本周大测将在周六解锁</div>';
                document.querySelector('#weeklyPanel .submit-btn').style.display = 'none';
                return;
            }
            document.querySelector('#weeklyPanel .submit-btn').style.display = 'inline-block';

            var html = '';
            for (var i = 0; i < weeklyData.weeklyQuiz.length; i++) {
                var q = weeklyData.weeklyQuiz[i];
                var optionsHtml = '';
                for (var j = 0; j < q.options.length; j++) {
                    optionsHtml += '<label><input type="radio" name="weekly_' + weekIndex + '_' + i + '" value="' + j + '"> ' + q.options[j] + '</label>';
                }
                html += '<div class="quiz-item">' +
                    '<div class="quiz-question">' + (i+1) + '. ' + q.q + '</div>' +
                    '<div class="quiz-options">' + optionsHtml + '</div>' +
                    '<div class="quiz-result" id="weekly_result_' + weekIndex + '_' + i + '"></div>' +
                    '</div>';
            }
            list.innerHTML = html;
            document.getElementById('weeklyScore').style.display = 'none';
        }

        // 提交每日小测
        function submitDailyQuiz() {
            var dayIndex = getCurrentDayIndex();
            var dayData = planData[dayIndex % planData.length];
            var correct = 0;

            for (var i = 0; i < dayData.quiz.length; i++) {
                var selected = document.querySelector('input[name="daily_' + dayIndex + '_' + i + '"]:checked');
                var resultEl = document.getElementById('daily_result_' + dayIndex + '_' + i);
                
                if (!selected) {
                    resultEl.className = 'quiz-result wrong';
                    resultEl.textContent = '未作答；正确答案：' + dayData.quiz[i].options[dayData.quiz[i].answer] + '。解析：' + dayData.quiz[i].desc;
                    continue;
                }

                if (parseInt(selected.value) === dayData.quiz[i].answer) {
                    correct++;
                    resultEl.className = 'quiz-result correct';
                    resultEl.textContent = '✅ 回答正确！' + dayData.quiz[i].desc;
                } else {
                    resultEl.className = 'quiz-result wrong';
                    resultEl.textContent = '❌ 回答错误。正确答案：' + dayData.quiz[i].options[dayData.quiz[i].answer] + '。解析：' + dayData.quiz[i].desc;
                }
            }

            var scoreEl = document.getElementById('dailyScore');
            scoreEl.style.display = 'block';
            scoreEl.textContent = '本次得分：' + correct + ' / ' + dayData.quiz.length;
        }

        // 提交每周大测
        function submitWeeklyQuiz() {
            var weekIndex = Math.floor(getCurrentDayIndex() / 7);
            var weeklyIndex = weekIndex * 7 + 5;
            var weeklyData = planData[weeklyIndex];
            var correct = 0;

            for (var i = 0; i < weeklyData.weeklyQuiz.length; i++) {
                var selected = document.querySelector('input[name="weekly_' + weekIndex + '_' + i + '"]:checked');
                var resultEl = document.getElementById('weekly_result_' + weekIndex + '_' + i);
                
                if (!selected) {
                    resultEl.className = 'quiz-result wrong';
                    resultEl.textContent = '未作答；正确答案：' + weeklyData.weeklyQuiz[i].options[weeklyData.weeklyQuiz[i].answer] + '。';
                    continue;
                }

                if (parseInt(selected.value) === weeklyData.weeklyQuiz[i].answer) {
                    correct++;
                    resultEl.className = 'quiz-result correct';
                    resultEl.textContent = '✅ 正确';
                } else {
                    resultEl.className = 'quiz-result wrong';
                    resultEl.textContent = '❌ 错误，正确答案：' + weeklyData.weeklyQuiz[i].options[weeklyData.weeklyQuiz[i].answer];
                }
            }

            var scoreEl = document.getElementById('weeklyScore');
            scoreEl.style.display = 'block';
            scoreEl.textContent = '周测得分：' + correct + ' / ' + weeklyData.weeklyQuiz.length;
        }

        // 本地存储进度
        function saveTodo(dayIndex, todoIndex) {
            var checkbox = document.getElementById('todo_' + dayIndex + '_' + todoIndex);
            var item = document.getElementById('todo_' + dayIndex + '_' + todoIndex + '_item');
            
            if (checkbox.checked) {
                item.classList.add('done');
            } else {
                item.classList.remove('done');
            }

            var key = 'study_plan_todo_' + dayIndex;
            var doneList = JSON.parse(localStorage.getItem(key) || '[]');
            if (checkbox.checked) {
                if (doneList.indexOf(todoIndex) === -1) doneList.push(todoIndex);
            } else {
                var newList = [];
                for (var k = 0; k < doneList.length; k++) {
                    if (doneList[k] !== todoIndex) newList.push(doneList[k]);
                }
                doneList = newList;
            }
            localStorage.setItem(key, JSON.stringify(doneList));
        }

        // 加载进度
        function loadProgress() {
            var dayIndex = getCurrentDayIndex();
            var key = 'study_plan_todo_' + dayIndex;
            var doneList = JSON.parse(localStorage.getItem(key) || '[]');
            
            for (var i = 0; i < doneList.length; i++) {
                var checkbox = document.getElementById('todo_' + dayIndex + '_' + doneList[i]);
                var item = document.getElementById('todo_' + dayIndex + '_' + doneList[i] + '_item');
                if (checkbox && item) {
                    checkbox.checked = true;
                    item.classList.add('done');
                }
            }
        }

        // 页面加载完成后初始化
        window.onload = init;
    </script>
